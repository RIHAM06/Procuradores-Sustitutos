<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Pruebas Automatizadas | Procuradores Sustitutos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pro-platform.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px 20px;
            margin: 0;
        }
        .test-container {
            max-width: 960px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .test-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .stat-value.passed { color: #10b981; }
        .stat-value.failed { color: #ef4444; }
        .stat-value.total { color: #38bdf8; }
        .stat-value.duration { color: #f59e0b; }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }
        .test-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #0f172a;
            border-left: 4px solid #475569;
            transition: all 0.2s;
        }
        .test-row.passed {
            border-left-color: #10b981;
        }
        .test-row.failed {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .test-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .test-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
        }
        .test-msg {
            font-size: 0.82rem;
            color: #94a3b8;
        }
        .test-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .badge-passed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        .badge-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .badge-running {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .actions-bar {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <div>
                <h1><span>🧪</span> Suite de Pruebas Automatizadas QA</h1>
                <p style="margin: 6px 0 0 0; color: #94a3b8; font-size: 0.88rem;">
                    Verificación técnica exhaustiva de los 15 requisitos obligatorios de reingeniería.
                </p>
            </div>
            <div>
                <button id="btn-run-tests" class="pro-btn pro-btn-primary" style="background: #38bdf8; color: #0f172a; font-weight: 700;">
                    ▶ Ejecutar Pruebas
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value total" id="stat-total">15</div>
                <div class="stat-label">Total Pruebas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value passed" id="stat-passed">0</div>
                <div class="stat-label">Exitosas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value failed" id="stat-failed">0</div>
                <div class="stat-label">Fallidas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value duration" id="stat-duration">0 ms</div>
                <div class="stat-label">Tiempo Total</div>
            </div>
        </div>

        <div id="tests-list">
            <!-- Rellenado dinámicamente -->
        </div>

        <div class="actions-bar">
            <a href="../index.html" class="pro-btn pro-btn-secondary" style="color: #f8fafc; background: #334155;">
                ← Volver a la Aplicación Principal
            </a>
            <div style="font-size: 0.8rem; color: #64748b;">
                Entorno: Local / Netlify CI • Protocolo: ES Modules
            </div>
        </div>
    </div>

    <!-- Cargar SDK Oficial de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Cargar Datasets de Juzgados y Municipios de España -->
    <script src="../js/courts-database.js"></script>
    <script src="../js/spain-all-municipalities.js"></script>

    <script type="module">
        import { runAllTests } from './automated-tests.js';

        const listEl = document.getElementById('tests-list');
        const passedEl = document.getElementById('stat-passed');
        const failedEl = document.getElementById('stat-failed');
        const durationEl = document.getElementById('stat-duration');
        const runBtn = document.getElementById('btn-run-tests');

        async function startTesting() {
            listEl.innerHTML = '';
            runBtn.disabled = true;
            runBtn.innerText = 'Ejecutando...';

            let passed = 0;
            let failed = 0;
            const startTime = performance.now();

            await runAllTests((result, index, total) => {
                if (result.status === 'PASSED') passed++;
                else failed++;

                passedEl.innerText = passed;
                failedEl.innerText = failed;
                durationEl.innerText = Math.round(performance.now() - startTime) + ' ms';

                const row = document.createElement('div');
                row.className = `test-row ${result.status.toLowerCase()}`;
                row.innerHTML = `
                    <div class="test-info">
                        <span class="test-title">Prueba #${result.id}: ${result.name}</span>
                        <span class="test-msg">${result.message}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 0.75rem; color: #64748b;">${result.duration} ms</span>
                        <span class="test-badge badge-${result.status.toLowerCase()}">${result.status}</span>
                    </div>
                `;
                listEl.appendChild(row);
            });

            runBtn.disabled = false;
            runBtn.innerText = '▶ Reejecutar Pruebas';
        }

        runBtn.addEventListener('click', startTesting);
        // Autoejecución al cargar
        window.addEventListener('DOMContentLoaded', startTesting);
    </script>
</body>
</html>
